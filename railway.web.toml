# The demo UI on Railway.  (Service config: point this service's config file here.)
#
# Holds no key. Payment happens one of two ways, and neither puts one in this process:
# the visitor connects their own wallet over WalletConnect, or this calls the demo-wallet
# service over Railway's private network.
#
# `numReplicas = 1` for a smaller reason than the seller's: a payment prepared on one
# instance is held in memory until the wallet signs it, so a signature returning to a
# different instance would find nothing pending.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[deploy]
startCommand = "pnpm web"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
